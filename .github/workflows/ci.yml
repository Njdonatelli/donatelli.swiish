name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

# Tests and the build need nothing beyond reading the repo; no secrets are used.
permissions:
  contents: read

jobs:
  test:
    name: Test and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

      # CI=true makes react-scripts treat lint warnings as errors.
      - name: Build admin
        run: npm run build
        env:
          CI: "true"
