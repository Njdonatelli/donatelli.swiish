services:
  swiish:
    build: .
    container_name: swiish
    restart: unless-stopped
    # Every other setting comes from .env (copy .env.example; secrets never go in this file).
    env_file: .env
    environment:
      # Pinned here so a .env copied from development cannot switch off the production checks
      - NODE_ENV=production
      - PORT=3000
    ports:
      # Loopback only: the TLS reverse proxy (or tunnel) on this host is the public entry.
      - "127.0.0.1:8095:3000"
    volumes:
      - ./data:/app/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
